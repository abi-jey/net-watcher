# Optional reader identity for an in-cluster collector; contains no deployment secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: net-watcher-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: net-watcher-reader
rules:
  - apiGroups: [""]
    resources: [pods, services, nodes]
    verbs: [list]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
  - apiGroups: [cilium.io]
    resources: [ciliumnodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: net-watcher-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: net-watcher-reader
subjects:
  - kind: ServiceAccount
    name: net-watcher-reader
    namespace: default
