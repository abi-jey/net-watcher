name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: ./.github/actions/ui
    - uses: ./.github/actions/setup-go

    - name: Test
      run: go test -race ./...

    - uses: ./.github/actions/security-gate

    # cgo is required (SQLite, AF_PACKET); the build action cross-compiles
    # arm64 with gcc-aarch64-linux-gnu. A CGO_ENABLED=0 build does not compile.
    - name: Build binaries
      uses: ./.github/actions/build
      with:
        version: ${{ github.ref_name }}
        commit_sha: ${{ github.sha }}
        build_time: ${{ github.event.head_commit.timestamp }}

    - name: Generate checksums
      working-directory: dist
      run: |
        for binary in net-watcher-linux-amd64 net-watcher-linux-arm64; do
          sha256sum "$binary" > "$binary.sha256"
          sha512sum "$binary" > "$binary.sha512"
        done

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: net-watcher-binaries
        path: |
          dist/net-watcher-linux-*

  image:
    name: Release image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build and scan
      uses: ./.github/actions/image
      with:
        version: ${{ github.ref_name }}
        commit_sha: ${{ github.sha }}

    - name: Push to GHCR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
        echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker tag net-watcher:ci "$IMAGE:${GITHUB_REF_NAME}"
        docker push "$IMAGE:${GITHUB_REF_NAME}"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, image]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: release-artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        
        # Move all binaries to release-assets directory
        find release-artifacts -type f -name "net-watcher-*" ! -name "*.sha*" -exec cp {} release-assets/ \;
        
        # Move checksum files
        find release-artifacts -name "*.sha*" -exec cp {} release-assets/ \;
        
        # List all files
        ls -la release-assets/
        
        # Create checksums.txt with all checksums
        cd release-assets
        for binary in net-watcher-*; do
          if [[ ! "$binary" == *.sha* ]]; then
            echo "=== $binary ==="
            if [[ -f "$binary.sha256" ]]; then
              echo "SHA256:" >> checksums.txt
              cat "$binary.sha256" >> checksums.txt
              echo "" >> checksums.txt
            fi
            if [[ -f "$binary.sha512" ]]; then
              echo "SHA512:" >> checksums.txt
              cat "$binary.sha512" >> checksums.txt
              echo "" >> checksums.txt
            fi
            echo "" >> checksums.txt
          fi
        done

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        CURRENT_TAG=${GITHUB_REF#refs/tags/}
        
        if [[ -n "$PREVIOUS_TAG" ]]; then
          CHANGELOG=$(git log --pretty=format:"- %s" ${PREVIOUS_TAG}..${CURRENT_TAG})
        else
          CHANGELOG=$(git log --pretty=format:"- %s" ${CURRENT_TAG})
        fi
        
        # Save changelog to file
        echo "$CHANGELOG" > release-assets/CHANGELOG.md
        
        # Set output for release body
        BODY="## What's Changed\n\n"
        if [[ -n "$CHANGELOG" ]]; then
          BODY="$BODY$CHANGELOG"
        else
          BODY="$BODYInitial release"
        fi
        
        BODY="$BODY\n\n## Installation\n\n"
        BODY="$BODY### Quick Install (Linux/macOS)\n"
        BODY="$BODY\`\`\`bash\n"
        BODY="$BODYcurl -L https://github.com/abja/net-watcher/releases/download/$CURRENT_TAG/net-watcher-linux-amd64 -o net-watcher\n"
        BODY="$BODYchmod +x net-watcher\n"
        BODY="$BODYsudo ./net-watcher install\n"
        BODY="$BODY\`\`\`\n\n"
        BODY="$BODY### Manual Install\n"
        BODY="$BODYDownload the binary for your platform from the assets below.\n\n"
        BODY="$BODY### Verify Checksums\n"
        BODY="$BODYAll binaries are accompanied by SHA256 and SHA512 checksum files.\n\n"
        BODY="$BODY---\n"
        
        # Save to GitHub output
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: Net Watcher ${{ github.ref_name }}
        body: ${{ steps.changelog.outputs.body }}
        draft: false
        prerelease: false
        generate_release_notes: false
        files: |
          release-assets/*
        token: ${{ secrets.GITHUB_TOKEN }}