# Generated by Copilot
name: CI

on:
  push:
    branches: ['*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/ui
    - uses: ./.github/actions/setup-go
    - run: go test -v -race ./...
    - run: go vet ./...
    - uses: ./.github/actions/security-gate
    - name: Install and run golangci-lint
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        golangci-lint run --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: ./.github/actions/ui
    - uses: ./.github/actions/setup-go

    - name: Determine version
      id: version
      uses: ./.github/actions/version
      with:
        ref_name: ${{ github.ref_name }}
        sha: ${{ github.sha }}

    - name: Build binaries
      uses: ./.github/actions/build
      with:
        version: ${{ steps.version.outputs.version }}
        commit_sha: ${{ github.sha }}
        build_time: ${{ github.event.head_commit.timestamp }}

    - uses: actions/upload-artifact@v7
      with:
        name: net-watcher-binaries
        path: dist/*

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7

    - name: Build and scan
      uses: ./.github/actions/image
      with:
        version: ${{ github.ref_name }}-${{ github.sha }}
        commit_sha: ${{ github.sha }}

    - name: Push to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
        echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        for tag in main "sha-${GITHUB_SHA::7}"; do
          docker tag net-watcher:ci "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
        done

  release:
    name: Pre-release
    runs-on: ubuntu-latest
    needs: [build, image]
    if: github.event_name == 'push'
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: net-watcher-binaries
        path: dist

    - name: Create Pre-release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.build.outputs.version }}
        name: Build ${{ needs.build.outputs.version }}
        body: |
          Pre-release from `${{ github.ref_name }}` branch.
          **Commit:** `${{ github.sha }}`
        prerelease: ${{ needs.build.outputs.prerelease }}
        files: dist/*
        token: ${{ secrets.GITHUB_TOKEN }}