# Generic distributed deployment. Create net-watcher-ingest-token separately;
# do not commit its value or environment-specific image references.
apiVersion: v1
kind: Namespace
metadata:
  name: net-watcher
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: net-watcher-collector
  namespace: net-watcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: net-watcher-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: net-watcher-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: net-watcher-reader
subjects:
  - kind: ServiceAccount
    name: net-watcher-collector
    namespace: net-watcher
---
apiVersion: v1
kind: Service
metadata:
  name: net-watcher-ingest
  namespace: net-watcher
spec:
  selector:
    app.kubernetes.io/name: net-watcher-ingest
  ports:
    - name: ingest
      port: 8921
      targetPort: ingest
---
apiVersion: v1
kind: Service
metadata:
  name: net-watcher-map
  namespace: net-watcher
spec:
  selector:
    app.kubernetes.io/name: net-watcher-ingest
  ports:
    - name: web
      port: 8920
      targetPort: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: net-watcher-map
  namespace: net-watcher
  annotations:
    ts-serve.io/hostname: net-watcher
spec:
  ingressClassName: ts-serve
  defaultBackend:
    service:
      name: net-watcher-map
      port:
        number: 8920
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: net-watcher-ingest
  namespace: net-watcher
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-watcher-ingest
  namespace: net-watcher
  labels:
    app.kubernetes.io/name: net-watcher-ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: net-watcher-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: net-watcher-ingest
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: busybox:1.37
          command: ["sh", "-ec", "mkdir -p /var/lib/net-watcher && chown -R 65532:65532 /var/lib/net-watcher"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /var/lib/net-watcher
      containers:
        - name: ingest
          image: ghcr.io/abi-jey/net-watcher:map-k8s
          args:
            - start
            - --capture=false
            - --web-host=0.0.0.0
            - --web-port=8920
            - --ingest-port=8921
            - --ingest-token=$(INGEST_TOKEN)
            - --db=/var/lib/net-watcher/netwatcher.db
          env:
            - name: TZ
              value: UTC
            - name: SQLITE_TMPDIR
              value: /var/lib/net-watcher
            - name: TMPDIR
              value: /var/lib/net-watcher
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: net-watcher-ingest-token
                  key: token
          ports:
            - name: web
              containerPort: 8920
            - name: ingest
              containerPort: 8921
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: data
              mountPath: /var/lib/net-watcher
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: net-watcher-ingest
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: net-watcher-collector
  namespace: net-watcher
  labels:
    app.kubernetes.io/name: net-watcher-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: net-watcher-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: net-watcher-collector
    spec:
      serviceAccountName: net-watcher-collector
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: busybox:1.37.0
          command: ["sh", "-ec", "mkdir -p /var/lib/net-watcher && chown -R 0:0 /var/lib/net-watcher"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/net-watcher
      containers:
        - name: collector
          image: ghcr.io/abi-jey/net-watcher:map-k8s
          args:
            - start
            - --kubernetes
            - --web=false
            - --collector-id=$(NODE_NAME)
            - --ingest-url=http://net-watcher-ingest.net-watcher.svc:8921
            - --ingest-token=$(INGEST_TOKEN)
            - --db=/var/lib/net-watcher/netwatcher.db
            - --web-host=127.0.0.1
            - --traffic-exclude=multicast,broadcast,linklocal,bittorrent,mdns,ssdp,metadata,ndp,unreachable
          env:
            - name: TZ
              value: UTC
            - name: SQLITE_TMPDIR
              value: /var/lib/net-watcher
            - name: TMPDIR
              value: /var/lib/net-watcher
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: net-watcher-ingest-token
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
            readOnlyRootFilesystem: true
            # CRI-O does not retain an added effective capability for this
            # non-root host-network process; root retains only NET_RAW here.
            runAsUser: 0
            # CRI-O RuntimeDefault blocks AF_PACKET sockets even with NET_RAW.
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: data
              mountPath: /var/lib/net-watcher
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          hostPath:
            path: /var/lib/net-watcher
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
